plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.playearn.arena'
    compileSdk 35

    defaultConfig {
        applicationId 'com.playearn.arena'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0-beta'
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '"370770458519-sobjb4r7blc256dpg5hiq8iq106ep5l8.apps.googleusercontent.com"'
    }

    signingConfigs {
        beta {
            def keyPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.beta
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
}
