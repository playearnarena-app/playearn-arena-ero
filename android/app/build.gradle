plugins {
    id 'com.android.application'
}

android {
    namespace 'com.playearn.arena'
    compileSdk 35

    defaultConfig {
        applicationId 'com.playearn.arena'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0-beta'
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '"370770458519-sobjb4r7blc256dpg5hiq8iq106ep5l8.apps.googleusercontent.com"'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
}
